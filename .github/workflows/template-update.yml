# Applies new wp-plugin-template releases to this repo.
#
# The hosted Renovate app cannot run `copier update` (postUpgradeTasks are
# self-hosted only), so a Renovate PR would bump .copier-answers.yml without
# re-stamping the scaffolding. This workflow runs the real `copier update` and
# opens a PR that goes through full CI (lint, tests, build + verify-scoped-bundle)
# before it can merge.
#
# Requires a repo or org secret TEMPLATE_UPDATE_TOKEN: a token with
# contents:write + pull-requests:write on this repo and contents:read on the
# private wp-plugin-template repo. Using it (not GITHUB_TOKEN) is what lets the
# opened PR trigger CI — so GITHUB_TOKEN itself stays read-only (below).
name: Template update

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

# All writes use TEMPLATE_UPDATE_TOKEN, so GITHUB_TOKEN needs no write scope.
permissions:
  contents: read

# Only one update run may write to chore/template-update at a time; a scheduled
# and a manual run overlapping would otherwise race on the branch.
concurrency:
  group: template-update
  cancel-in-progress: false

jobs:
  copier-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Always update from the default branch, even on manual dispatch from
          # another ref, so the PR is never based on a stale branch's state.
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.TEMPLATE_UPDATE_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install copier
        # Pinned to a major range for deterministic updates; Copier majors can
        # change update behaviour.
        run: pipx install "copier>=9,<10"


      - name: Configure git identity
        run: |
          git config user.name "template-update[bot]"
          git config user.email "support@jaypee.solutions"

      - name: copier update
        # Token exists only in this step's process env (GIT_CONFIG_*), scoped
        # to the exact template URL; nothing is written to any git config file.
        env:
          TEMPLATE_UPDATE_TOKEN: ${{ secrets.TEMPLATE_UPDATE_TOKEN }}
        run: |
          src="$(bash .github/scripts/template-src-url.sh)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${TEMPLATE_UPDATE_TOKEN}@${src#https://}.insteadOf"
          export GIT_CONFIG_VALUE_0="$src"
          copier update --defaults --trust --skip-tasks

      - name: Open PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.TEMPLATE_UPDATE_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: chore/template-update
          delete-branch: true
          title: "chore: apply latest wp-plugin-template"
          commit-message: "chore: copier update to latest wp-plugin-template"
          body: |
            Automated `copier update` to the latest wp-plugin-template release.

            CI (lint, unit tests, build + verify-scoped-bundle) runs on this PR —
            merge once green.
